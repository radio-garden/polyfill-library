dependencies = [
	"Object.getOwnPropertyNames",
	"Promise",
	"Symbol.iterator",
	"URL"
]
license = "MIT"
spec = "https://fetch.spec.whatwg.org/"
notes = [
	"Where the browser has a native fetch without abort support, the native fetch, Request, Response and Headers are kept and only `signal` support is added. Aborting rejects the fetch but does not stop a request already sent; the body of a response that arrives after the abort is cancelled.",
	"Where the browser has no native fetch: makes use of FormData, FileReader and Blob if they exist. Readable streams not supported. CORS (Cross Origin Resource Sharing) requests do not work in IE 9 or lower."
]
docs = "https://developer.mozilla.org/en-US/docs/Web/API/GlobalFetch/fetch"

[browsers]
android = "*"
bb = "10 - *"
chrome = "<66"
edge = "<16"
edge_mob = "<16"
firefox = "<57"
firefox_mob = "<64"
ie = "*"
ie_mob = "*"
opera = "<53"
op_mob = "<47"
safari = "<12.1"
ios_saf = "<12.2"
samsung_mob = "<9.0"
